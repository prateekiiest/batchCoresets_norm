
name: AI Assistance and Commit Provenance Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit commit declarations and obvious AI markers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(
                  ["git", *args], text=True, errors="replace"
              )

          event = os.environ["EVENT_NAME"]

          if event == "pull_request":
              base = os.environ["PR_BASE"]
              head = os.environ["PR_HEAD"]
          else:
              base = os.environ.get("BEFORE_SHA", "")
              head = os.environ.get("AFTER_SHA", "") or "HEAD"

          if not head or set(head) == {"0"}:
              head = "HEAD"

          if not base or set(base) == {"0"}:
              commits = [git("rev-parse", head).strip()]
              diff_range = commits[0]
          else:
              commits = git(
                  "rev-list", "--reverse", f"{base}..{head}"
              ).split()
              diff_range = f"{base}..{head}"

          findings = []

          # Require an explicit declaration in commit messages.
          # This is an accountability check, not AI detection.
          for commit in commits:
              message = git("show", "-s", "--format=%B", commit)
              declaration = re.search(
                  r"(?im)^AI-Assistance:\s*(none|used|unknown)\s*$",
                  message
              )

              if not declaration:
                  findings.append(
                      f"{commit[:12]}: missing AI-Assistance trailer"
                  )
              elif declaration.group(1).lower() == "unknown":
                  findings.append(
                      f"{commit[:12]}: AI assistance declared unknown"
                  )

          # Scan added/modified lines for a small set of obvious markers.
          # These are review signals only; they can be false positives.
          markers = [
              re.compile(r"as an ai language model", re.I),
              re.compile(r"generated by chatgpt", re.I),
              re.compile(r"written by chatgpt", re.I),
              re.compile(r"\bAI-GENERATED:\s*(true|yes)\b", re.I),
              re.compile(r"\bTODO:\s*replace ai-generated", re.I),
          ]

          diff = git(
              "diff", "--no-ext-diff", "--unified=0",
              diff_range, "--"
          )

          for line in diff.splitlines():
              if not line.startswith("+") or line.startswith("+++"):
                  continue
              text = line[1:]
              if any(pattern.search(text) for pattern in markers):
                  findings.append(
                      "Added line contains an AI-related marker: "
                      + text[:180]
                  )

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as f:
              f.write("# AI-assistance provenance audit\n\n")
              f.write(
                  "This workflow cannot reliably determine whether AI "
                  "authored code or prose. Findings are review signals, "
                  "not proof of AI use or misconduct.\n\n"
              )

              if findings:
                  f.write("## Items to review\n\n")
                  for item in findings:
                      f.write(f"- {item}\n")
              else:
                  f.write(
                      "No configured markers found. This does not prove "
                      "that AI was or was not used.\n"
                  )

          for item in findings:
              print(f"::warning::{item}")

          print(f"Audit complete: {len(findings)} item(s) to review.")
          PY
