
name: Scheduled AI Assistance Report

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "reports/ai-usage/**"
      - ".github/workflows/ai-usage-report.yml"

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate report
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from collections import Counter

          def git(*args):
              return subprocess.check_output(
                  ["git", *args], text=True, errors="replace"
              ).strip()

          now = datetime.now(timezone.utc)
          since = now - timedelta(hours=24)
          commits = git(
              "log", "origin/main",
              "--since=" + since.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "--format=%H%x1f%aI%x1f%s%x1f%b%x1e"
          ).split("\x1e")

          rows, seen = [], set()
          markers = [
              r"as an ai language model",
              r"generated by chatgpt",
              r"written by chatgpt",
              r"AI-GENERATED:\s*(true|yes)",
          ]

          for raw in commits:
              p = raw.strip().split("\x1f", 3)
              if len(p) != 4 or not p[0] or p[0] in seen:
                  continue
              sha, date, subject, body = p
              seen.add(sha)
              message = subject + "\n" + body
              m = re.search(
                  r"(?im)^AI-Assistance:\s*(none|used|unknown)\s*$",
                  message
              )
              status = m.group(1).lower() if m else "missing"

              diff = git("show", "--format=", "--unified=0", sha, "--")
              hits = []
              for line in diff.splitlines():
                  if line.startswith("+") and not line.startswith("+++"):
                      text = line[1:]
                      if any(re.search(x, text, re.I) for x in markers):
                          hits.append(text[:120])

              tools = re.findall(
                  r"(?im)^AI-Tools:\s*(.+?)\s*$", message
              )
              roles = re.findall(
                  r"(?im)^AI-Role:\s*(.+?)\s*$", message
              )
              rows.append((sha, date, subject, status, tools, roles, hits))

          counts = Counter(r[3] for r in rows)
          lines = [
              f"# AI Assistance Report — {now:%Y-%m-%d} UTC",
              "",
              f"- Repository: `{os.environ['REPOSITORY']}`",
              f"- Window: previous 24 hours",
              f"- Commits reviewed: **{len(rows)}**",
              "",
              "| Commit declaration | Count |",
              "|---|---:|",
              f"| Declared AI assistance used | {counts['used']} |",
              f"| Declared no AI assistance | {counts['none']} |",
              f"| Declared unknown | {counts['unknown']} |",
              f"| Missing declaration | {counts['missing']} |",
              "",
              "> These are declaration counts, not measured AI authorship or a percentage of AI-generated content. Text-marker matches are weak review signals, not proof.",
              "",
              "## Commit details",
              ""
          ]

          for sha, date, subject, status, tools, roles, hits in rows:
              lines += [
                  f"### `{sha[:12]}` — {subject}",
                  f"- Date: {date}",
                  f"- AI-Assistance declaration: **{status}**"
              ]
              if tools:
                  lines.append("- AI tools declared: " + ", ".join(tools))
              if roles:
                  lines.append("- AI roles declared: " + ", ".join(roles))
              if hits:
                  lines.append(
                      "- **Review flag:** configured AI-related marker "
                      "found in added lines."
                  )
              lines.append("")

          lines += [
              "## Limitations",
              "",
              "- Missing declarations do not prove AI was used.",
              "- `AI-Assistance: none` is an author declaration, not independent verification.",
              "- Marker matches can be false positives; AI use can also go undetected.",
              "- Git history cannot reliably measure AI contribution by lines, time, or percentage."
          ]

          report = Path("reports/ai-usage")
          report.mkdir(parents=True, exist_ok=True)
          output = report / f"{now:%Y-%m-%d}.md"
          output.write_text("\n".join(lines) + "\n", encoding="utf-8")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          print(f"Created {output}")
          PY

      - name: Commit dated report
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ai-usage/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Add scheduled AI assistance report [skip ci]"
          git push origin HEAD:main
