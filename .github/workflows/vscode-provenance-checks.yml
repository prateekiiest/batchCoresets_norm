name: VS Code Provenance Extension Checks
on:
  push:
    paths:
      - 'vscode-provenance/**'
      - '.github/workflows/vscode-provenance-checks.yml'
  pull_request:
    paths:
      - 'vscode-provenance/**'
      - '.github/workflows/vscode-provenance-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: node --check vscode-provenance/extension.js
      - name: Validate extension manifest
        run: node -e "const p=require('./vscode-provenance/package.json'); if (!p.main || !p.contributes.commands || !p.engines.vscode) process.exit(1); console.log('Manifest OK')"
