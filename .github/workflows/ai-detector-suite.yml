name: AI Detector Suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-detector-suite-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-ai-detectors-v1-${{ runner.os }}-${{ hashFiles('.github/workflows/ai-detector-suite.yml') }}
          restore-keys: |
            hf-ai-detectors-v1-${{ runner.os }}-

      - name: Install detector dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml "transformers>=4.45,<5"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "git+https://github.com/houtini-ai/ai-detect.git"

      - name: Fetch open Coderbuds attribution rules
        run: git clone --depth 1 https://github.com/coderbuds/ai-detector.git vendor/coderbuds-ai-detector

      - name: Run the three-detector suite
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_BRANCH: ${{ github.head_ref || github.ref_name }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/ai_detector_suite.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --rules-dir vendor/coderbuds-ai-detector/rules \
            --report ai-detector-report.json \\
            --markdown-report ai-detector-report.md

      - name: Upload detector report
        if: always() && hashFiles('ai-detector-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ai-detector-report-${{ github.run_id }}
          path: |
            ai-detector-report.json
            ai-detector-report.md
          retention-days: 30
